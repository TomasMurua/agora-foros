spring.application.name=ms-usuarios
server.port=${PORT:8081}

# Conexion a Oracle (esquema USUARIOS_MS).
# Local: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
# Oracle Cloud (Autonomous Database con Wallet): jdbc:oracle:thin:@<servicio>_high?TNS_ADMIN=/ruta/al/wallet
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:USUARIOS_MS}
spring.datasource.password=${DB_PASSWORD:Usuarios_Ms2026}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# Las tablas se crean con los scripts de la carpeta bd/
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT: ms-usuarios firma los tokens. La misma clave va en ms-foro y ms-moderacion
app.jwt.secret=${JWT_SECRET:agora-foros-clave-local-de-desarrollo-2026-cambiar}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:120}
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://localhost:8080}

logging.level.root=INFO
logging.level.cl.agora=${LOG_NIVEL:DEBUG}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.nombre=ms-usuarios
info.app.descripcion=Microservicio de usuarios, roles e inicio de sesion de Agora Foros
info.app.version=2.0.0
