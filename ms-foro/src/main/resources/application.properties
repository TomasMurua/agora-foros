spring.application.name=ms-foro
server.port=${PORT:8082}

# Conexion a Oracle (esquema FORO_MS)
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:FORO_MS}
spring.datasource.password=${DB_PASSWORD:Foro_Ms2026}
spring.datasource.hikari.maximum-pool-size=5

# Las tablas se crean con los scripts de la carpeta bd/
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# JWT (misma clave que ms-usuarios, que es quien emite los tokens)
app.jwt.secret=${JWT_SECRET:agora-foros-clave-local-de-desarrollo-2026-cambiar}
app.cors.origenes=http://localhost:3000,http://localhost:4200,http://localhost:5173

# Logging
logging.level.root=INFO
logging.level.cl.agora=DEBUG
logging.level.org.hibernate.SQL=DEBUG

management.endpoints.web.exposure.include=health,info
