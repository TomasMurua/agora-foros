server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

  # Archivos con hash en el nombre: se pueden guardar en caché por un año.
  location ~* "-[A-Za-z0-9_-]{8}\.(js|css|woff2?)$" {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location ~* \.(svg|png|ico)$ {
    add_header Cache-Control "public, max-age=604800";
    try_files $uri =404;
  }

  # index.html no se guarda en caché para que siempre cargue la última versión.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Rutas de la SPA: cualquier ruta que no sea un archivo vuelve a index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
