spring.application.name=ms-moderacion
server.port=${PORT:8083}

# Conexion a Oracle (esquema MODERACION_MS).
# Local: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
# Oracle Cloud (Autonomous Database con Wallet): jdbc:oracle:thin:@<servicio>_high?TNS_ADMIN=/ruta/al/wallet
spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:MODERACION_MS}
spring.datasource.password=${DB_PASSWORD:Moderacion_Ms2026}
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# Las tablas se crean con los scripts de la carpeta bd/
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT: misma clave en todos los microservicios (ms-usuarios es quien emite los tokens)
app.jwt.secret=${JWT_SECRET:agora-foros-clave-local-de-desarrollo-2026-cambiar}
app.cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://localhost:8080}

# ms-foro: ejecuta los baneos. url-publica es la que aparece en los enlaces HATEOAS
app.foro.url=${FORO_URL:http://localhost:8082}
app.foro.url-publica=${FORO_URL_PUBLICA:${FORO_URL:http://localhost:8082}}
app.foro.timeout-ms=${FORO_TIMEOUT_MS:5000}

logging.level.root=INFO
logging.level.cl.agora=${LOG_NIVEL:DEBUG}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.nombre=ms-moderacion
info.app.descripcion=Microservicio de moderacion de Agora Foros: normas, reportes y sanciones
info.app.version=2.0.0
