services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    container_name: agora-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-Agora2026}
    volumes:
      - ./bd:/opt/agora/bd:ro
      - ./docker/initdb:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
