#set( $symbol_pound = '#' )
#set( $symbol_dollar = '$' )
#set( $symbol_escape = '\' )
spring.application.name=${artifactId}
server.port=${symbol_dollar}{PORT:${puerto}}

${symbol_pound} Conexion a Oracle (esquema ${esquemaBd}).
${symbol_pound} Local: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
${symbol_pound} Oracle Cloud (Autonomous Database con Wallet): jdbc:oracle:thin:@<servicio>_high?TNS_ADMIN=/ruta/al/wallet
spring.datasource.url=${symbol_dollar}{DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${symbol_dollar}{DB_USER:${esquemaBd}}
spring.datasource.password=${symbol_dollar}{DB_PASSWORD:cambiar}
spring.datasource.hikari.maximum-pool-size=${symbol_dollar}{DB_POOL:5}

${symbol_pound} Las tablas se crean con los scripts de la carpeta bd/
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

${symbol_pound} JWT: misma clave en todos los microservicios (ms-usuarios es quien emite los tokens)
app.jwt.secret=${symbol_dollar}{JWT_SECRET:agora-foros-clave-local-de-desarrollo-2026-cambiar}
app.cors.origenes=${symbol_dollar}{CORS_ORIGENES:http://localhost:4200,http://localhost:8080}

logging.level.root=INFO
logging.level.cl.agora=${symbol_dollar}{LOG_NIVEL:DEBUG}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
info.app.nombre=${artifactId}
info.app.descripcion=${descripcion}
info.app.version=${version}
